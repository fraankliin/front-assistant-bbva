<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Login | BBVA AI Assistant</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">

            <h1>BBVA</h1>

            <p>AI Assistant</p>

        </div>

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Contraseña</label>

                <input
                    type="password"
                    id="password"
                    required
                >

            </div>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p class="auth-link">

            ¿No tienes cuenta?

            <a href="register.html">
                Regístrate
            </a>

        </p>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
