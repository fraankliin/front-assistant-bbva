<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Administración</title>

<link
    rel="stylesheet"
    href="../css/admin.css"
>

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-header">

            <h2>BBVA</h2>
            <span>AI Assistant</span>

        </div>

        <div class="navigation-section">

            <h4>Navegación</h4>

            <a href="chat.html" class="nav-item">
                 Chat
            </a>

            <a href="analytics.html" class="nav-item">
                 Analytics
            </a>

            <a href="search.html" class="nav-item">
                 Semantic Search
            </a>

            <a href="admin.html"
               class="nav-item active">
                 Administración
            </a>

        </div>

        <div class="sidebar-footer">

            <div id="userEmail"></div>

            <button id="logoutBtn">
                Cerrar sesión
            </button>

        </div>

    </aside>

    <main class="main-content">

        <div class="page-header">

            <h1>
                Administración
            </h1>

            <p>
                Gestión del sistema RAG.
            </p>

        </div>

        <div class="admin-grid">

            <div class="card">

                <h3>
                    Estado del Sistema
                </h3>

                <div id="systemStatus">

                    <div class="status-badge">
                        🟢 Operativo
                    </div>

                </div>

            </div>

            <div class="card">

                <h3>
                    Resumen
                </h3>

                <div id="overviewMetrics">

                    Cargando...

                </div>

            </div>

        </div>

        <div class="card">

            <h3>
                Indexación
            </h3>

            <button id="runScraperBtn">

                Ejecutar Scraper

            </button>

            <div id="scraperResult">

            </div>

        </div>

        <div class="card">

            <h3>
                Configuración RAG
            </h3>

            <div class="config-grid">

                <div class="config-item">

                    <label>
                        Threshold
                    </label>

                    <span>
                        0.4
                    </span>

                </div>

                <div class="config-item">

                    <label>
                        Top K
                    </label>

                    <span>
                        4
                    </span>

                </div>

            </div>

        </div>

        <div class="card">

            <h3>
                Logs
            </h3>

            <div id="logs">

                Sistema iniciado.

            </div>

        </div>

    </main>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>

</body>

</html>
