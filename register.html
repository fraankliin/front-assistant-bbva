<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Registro | BBVA AI Assistant</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">

            <h1>BBVA</h1>

            <p>AI Assistant</p>

        </div>

        <h2>Crear cuenta</h2>

        <form id="registerForm">

            <div class="form-group">
                <label>Nombre</label>
                <input
                    type="text"
                    id="name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Apellido</label>
                <input
                    type="text"
                    id="last_name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button type="submit">
                Registrarme
            </button>

        </form>

        <p class="auth-link">

            ¿Ya tienes cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </p>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
